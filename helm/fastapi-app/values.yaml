replicaCount: 3

image:
  repository: 192.168.0.113:5000/fastapi-demo
  tag: ""  # Latest build from v2.0.0 bump

service:
  port: 80
  targetPort: 8000

env:
  - name: ENV
    value: "production"
  - name: LOG_LEVEL
    value: "info"
  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
  - name: NODE_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"  