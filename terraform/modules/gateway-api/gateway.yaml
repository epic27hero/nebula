# apiVersion: gateway.networking.k8s.io/v1
# kind: Gateway
# metadata:
#   name: prod-gateway
#   namespace: production
# spec:
#   gatewayClassName: envoy
#   listeners:
#     - name: http
#       protocol: HTTP
#       port: 80


---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: prod-gateway
  namespace: production
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same