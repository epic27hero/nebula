# Kubernetes Deployment Configuration
# File: manifests/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  namespace: production
  labels:
    app: fastapi-demo
    version: v1
spec:
  # Number of pod replicas for load balancing
  replicas: 3  # Creates 3 instances of your app
  
  # Strategy for updating pods
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Max 1 extra pod during update
      maxUnavailable: 1  # Max 1 pod down during update
  
  # Selector to match pods
  selector:
    matchLabels:
      app: fastapi
  
  # Pod template
  template:
    metadata:
      labels:
        app: fastapi
        version: v1
      annotations:
        # Force pod recreation on every deployment
        rollout-timestamp: "TIMESTAMP_PLACEHOLDER"
    spec:
      containers:
      - name: fastapi
        # ⚠️ NOTE: This file is for reference only
        # The actual deployment uses Helm chart: helm/fastapi-app/
        # Helm values are updated by CI/CD pipeline in: helm/fastapi-app/values.yaml
        # Image tag is controlled by: .gitlab-ci.yml deploy stage
        image: 192.168.0.190:5005/root/project_nebula/fastapi-demo:latest
        imagePullPolicy: Always
        
        # Container port
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        
        # Environment variables
        env:
        - name: ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        
        # Kubernetes pod and node information
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        # Resource limits (adjust based on your needs)
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      # Restart policy
      restartPolicy: Always