# Kubernetes Service Configuration with LoadBalancer
# This provides external load balancing across all FastAPI pods
# File: manifests/service.yaml

apiVersion: v1
kind: Service
metadata:
  name: fastapi-demo
  namespace: production
  labels:
    app: fastapi-demo
spec:
  type: LoadBalancer  # External load balancer with automatic IP assignment
  
  selector:
    app: fastapi-demo  # Selects pods with this label
  
  ports:
    - name: http
      protocol: TCP
      port: 80          # External port (access via http://192.168.0.113)
      targetPort: 8000  # Container port (FastAPI runs on 8000)
  
  # Session affinity keeps requests from same client to same pod
  # Remove this section if you want pure round-robin load balancing
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
  
  # LoadBalancer specific configuration
  # This works with MetalLB on bare-metal/on-premise Kubernetes
  externalTrafficPolicy: Cluster  # Distributes traffic across all nodes
  # Use "Local" to preserve source IP but may cause uneven distribution