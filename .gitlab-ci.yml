stages: [build, push, scan, deploy, verify, release]

# =============================================================================
# GITLAB CI/CD PIPELINE — PROJECT NEBULA (PRODUCTION-READY GITOPS)
# =============================================================================
# ✔ Builds & pushes Docker images
# ✔ Scans with Trivy
# ✔ Updates Helm values.yaml (GitOps-safe)
# ✔ ArgoCD auto-syncs
# ✔ Verifies deployment
# ✔ Creates versioned release tags
# =============================================================================

variables:
  IMAGE_NAME: "fastapi-demo"

  DEPLOY_SERVER: ${DEPLOY_SERVER:-192.168.0.113}
  DEPLOY_USER: ${DEPLOY_USER:-root}

  GITLAB_HOST: ${GITLAB_HOST:-192.168.0.190}
  GITLAB_PORT: ${GITLAB_PORT:-80}
  GITLAB_PROTOCOL: ${GITLAB_PROTOCOL:-http}

  SERVICE_CONFIG_FILE: "config/service-endpoints.conf"

  GIT_STRATEGY: clone
  GIT_DEPTH: 0

  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: 1

# =============================================================================
# WORKFLOW RULES
# =============================================================================
workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_COMMIT_AUTHOR == "GitLab CI/CD"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
      when: always
    - if: $CI_COMMIT_BRANCH == "feature/gitlab-gitops-enhancements"
      when: always
    - when: never

# =============================================================================
# BEFORE SCRIPT
# =============================================================================
before_script: |
  echo "🔧 Preparing CI environment"
  echo "=================================================="
  echo

  if [ ! -f "${SERVICE_CONFIG_FILE}" ]; then
    echo "❌ ERROR: ${SERVICE_CONFIG_FILE} not found"
    exit 1
  fi

  echo "📋 Loading service endpoints"
  source "${SERVICE_CONFIG_FILE}"
  echo "✅ Endpoints loaded"
  echo

  git config --global user.email "gitlab-ci@project-nebula.local"
  git config --global user.name "GitLab CI/CD"

  mkdir -p ~/.ssh
  chmod 700 ~/.ssh

  if [ -z "$SSH_PRIVATE_KEY_GITLAB_TESTING_CI" ]; then
    echo "❌ SSH key missing"
    exit 1
  fi

  echo "$SSH_PRIVATE_KEY_GITLAB_TESTING_CI" > ~/.ssh/gitlab_ci
  chmod 600 ~/.ssh/gitlab_ci

  cat > ~/.ssh/config <<EOF
  Host gitlab
    HostName ${GITLAB_HOST}
    User git
    IdentityFile ~/.ssh/gitlab_ci
    StrictHostKeyChecking no
  EOF

# =============================================================================
# BUILD
# =============================================================================
build:
  stage: build
  script: |
    echo "🚧 BUILD PHASE"
    echo "=================================================="
    echo

    docker build \
      --cache-from ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .

    echo
    docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest
    docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}

    echo "✅ Build complete"

# =============================================================================
# PUSH
# =============================================================================
push:
  stage: push
  needs: [build]
  script: |
    echo "📤 PUSH PHASE"
    echo "=================================================="
    echo

    echo "${CI_REGISTRY_PASSWORD}" | docker login -u ${CI_REGISTRY_USER} --password-stdin ${CI_REGISTRY}

    for i in 1 2 3; do
      echo "Push attempt $i/3"
      docker push ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest &&
      docker push ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} && break
      sleep 3
    done

    echo "✅ Images pushed"

# =============================================================================
# SCAN
# =============================================================================
scan:
  stage: scan
  image: aquasec/trivy:latest
  needs: [push]
  script: |
    echo "🔍 SECURITY SCAN"
    echo "=================================================="
    echo

    trivy image \
      --severity HIGH,CRITICAL \
      --exit-code 0 \
      ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}

    echo "✅ Scan completed"
  allow_failure: true

# =============================================================================
# DEPLOY (GitOps — Helm values.yaml)
# =============================================================================
deploy:
  stage: deploy
  needs: [push, scan]
  script: |
    echo "🚀 DEPLOY (GitOps)"
    echo "=================================================="
    echo

    cp helm/fastapi-app/values.yaml helm/fastapi-app/values.yaml.bak

    sed -i "s|tag:.*|tag: \"${CI_COMMIT_SHORT_SHA}\"|g" helm/fastapi-app/values.yaml
    sed -i "s|repository:.*|repository: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}|g" helm/fastapi-app/values.yaml

    git add helm/fastapi-app/values.yaml
    git commit -m "🚀 Deploy ${CI_COMMIT_SHORT_SHA} [skip ci]"

    GIT_PUSH_URL="http://oauth2:${PROJECT_NEBULA_ACCESS_TOKEN}@${GITLAB_HOST}/${CI_PROJECT_PATH}.git"
    # GIT_PUSH_URL="http://${CI_DEPLOY_USER}:${CI_DEPLOY_TOKEN}@${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}.git"
    git push -o ci.skip "${GIT_PUSH_URL}" HEAD:${CI_COMMIT_BRANCH}

    echo "✅ Helm values updated — ArgoCD will sync"

  only:
    - master
    - feature/gitlab-gitops-enhancements

# =============================================================================
# VERIFY
# =============================================================================
verify:
  stage: verify
  needs: [deploy]
  script: |
    echo "🔎 VERIFY DEPLOYMENT"
    echo "=================================================="
    echo

    sleep 180

    if curl -fs "${FASTAPI_HEALTH_URL}" | grep -q healthy; then
      echo "✅ Health check passed"
    else
      echo "❌ Health check failed"
      exit 1
    fi
  allow_failure: true

# =============================================================================
# RELEASE
# =============================================================================
release:
  stage: release
  needs: [deploy, verify]
  script: |
    echo "🏷️ RELEASE"
    echo "=================================================="
    echo

    RELEASE_VERSION="v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"

    git tag -a "${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"
    GIT_PUSH_URL="http://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}.git"
    git push -o ci.skip "${GIT_PUSH_URL}" "${RELEASE_VERSION}"

    echo "✅ Release created: ${RELEASE_VERSION}"

  only:
    - master
    - feature/gitlab-gitops-enhancements

