# ============================================================================
# ✅ #4 - RELEASE STAGE: Create versioned releases with Git tags
# ============================================================================
# WHY: Track deployment versions for audit trail and easy rollbacks
#
# This stage:
# 1. Creates annotated Git tags for each deployment
# 2. Tags appear in GitLab Releases section (Deploy → Releases)
# 3. Release notes include deployment info, image, commit, etc.
# 4. Easy to identify which version is deployed where
# 5. Can rollback by checking out an old release tag
#
# BENEFIT: Full version history visible in GitLab UI
# ============================================================================
release:
  stage: release
  # -----> NEW: Release stage for version tracking
  script: |
    echo "🏷️  RELEASE PHASE - Creating versioned release"
    echo "=================================================="
    echo ""
    
    # Create release version from pipeline ID and commit SHA
    # Format: v{PIPELINE_ID}-{COMMIT_SHA}
    # Example: v12345-a1b2c3d4
    RELEASE_VERSION="v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    RELEASE_DATE=$(date '+%Y-%m-%d %H:%M:%S')
    
    echo "📝 Creating release: ${RELEASE_VERSION}"
    echo ""
    
    # -----> NEW: Create annotated Git tag (not lightweight)
    # Annotated tags are preferred for releases
    # They include: author, date, message, and can be signed
    git tag -a ${RELEASE_VERSION} -m "🚀 Release: ${RELEASE_VERSION}
    
    ═══════════════════════════════════════════════════════════
    DEPLOYMENT INFORMATION
    ═══════════════════════════════════════════════════════════
    
    Pipeline URL: ${CI_PIPELINE_URL}
    Commit SHA: ${CI_COMMIT_SHA}
    Branch: ${CI_COMMIT_BRANCH}
    Author: ${GITLAB_USER_LOGIN}
    Date: ${RELEASE_DATE}
    
    ═══════════════════════════════════════════════════════════
    IMAGE DETAILS
    ═══════════════════════════════════════════════════════════
    
    Docker Image: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    
    Container Registry Link:
    ${GITLAB_PROTOCOL}://${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}/container_registry
    
    ═══════════════════════════════════════════════════════════
    DEPLOYMENT ENDPOINTS - FROM SERVICE CONFIG
    ═══════════════════════════════════════════════════════════
    
    🔵 FastAPI Application
      ${FASTAPI_URL}
      - API: ${FASTAPI_URL}
      - Docs: ${FASTAPI_DOCS_URL}
      - Health: ${FASTAPI_HEALTH_URL}
      - Metrics: ${FASTAPI_METRICS_URL}
    
    📊 Monitoring Services
      - Prometheus: ${PROMETHEUS_URL}
      - Grafana: ${GRAFANA_URL} (${GRAFANA_CREDENTIALS})
    
    ⚙️  Management
      - ArgoCD: ${ARGOCD_URL}
    
    ☸️  Kubernetes
      - API Server: ${KUBE_API_SERVER}
    
    ═══════════════════════════════════════════════════════════
    SERVICE CONFIGURATION
    ═══════════════════════════════════════════════════════════
    
    All service endpoints are managed in: scripts/service-endpoints.conf
    
    To update endpoints after deployment:
      ./scripts/detect-service-ips.sh --update    (auto-detect from cluster)
      ./scripts/update-service-ips.sh              (interactive mode)
      ./scripts/update-service-ips.sh --reset      (reset to defaults)
    
    ═══════════════════════════════════════════════════════════
    KUBERNETES INFO
    ═══════════════════════════════════════════════════════════
    
    Namespace: production
    Deployment: fastapi-app
    Replicas: 3
    
    Check deployment status:
    kubectl get deployment fastapi-app -n production
    kubectl get pods -n production
    
    ═══════════════════════════════════════════════════════════
    HOW TO ROLLBACK
    ═══════════════════════════════════════════════════════════
    
    To rollback to this version:
    1. Open ArgoCD: http://192.168.0.202
    2. Go to fastapi-production app
    3. Click 'Sync' and select this commit SHA
    4. Or manually edit manifests/deployment.yaml with this image tag
    
    ═══════════════════════════════════════════════════════════
    "
    
    # -----> NEW: Push tag to repository
    # This makes the tag visible in GitLab's Release section
    # Using CI_JOB_TOKEN for authentication (built-in GitLab token)
    # GIT_PUSH_URL="${GITLAB_PROTOCOL}://oauth2:${PROJECT_NEBULA_ACCESS_TOKEN}@${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}.git"
    # git push -o ci.skip "${GIT_PUSH_URL}" ${RELEASE_VERSION}
    git push -o ci.skip "http://oauth2:${PROJECT_NEBULA_ACCESS_TOKEN}@192.168.0.190/root/project_nebula.git" ${RELEASE_VERSION}

    
    echo "✅ Release tag created and pushed: ${RELEASE_VERSION}"
    echo ""
    echo "📊 Release Available At:"
    echo "   GitLab UI: ${GITLAB_PROTOCOL}://${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}/-/releases/${RELEASE_VERSION}"
    echo ""
    echo "✅ Check 'Deploy → Releases' section in GitLab to view all releases"
  
  # -----> NEW: Only run on master branch after successful deploy
  # This ensures only stable deployments get tagged
  only:
    - master
    - feature/gitlab-gitops-enhancements
  when: on_success
  
  # -----> NEW: Retry configuration
  # If tagging fails, retry once
  retry:
    max: 1
    when:
      - script_failure

# ============================================================================
# ✅ #3 - KUBERNETES CLUSTER INTEGRATION (GitLab + K3s Connection)
# ============================================================================
# WHY: Enable GitLab to see pod status, logs, and deployment history
#
# This configuration allows:
# 1. View pods directly in GitLab Environments section
# 2. See pod logs without SSH/kubectl
# 3. Track deployment history in GitLab UI
# 4. Direct pod troubleshooting from GitLab
# 5. Team visibility without kubectl knowledge
#
# BENEFIT: Full cluster visibility in GitLab UI for entire team
#
# ============================================================================
# HOW TO ENABLE K8s CLUSTER INTEGRATION:
#
# Step 1: Generate Service Account Token in K3s
# ────────────────────────────────────────────────
# kubectl create serviceaccount gitlab-admin -n kube-system
# kubectl create clusterrolebinding gitlab-admin --clusterrole=cluster-admin --serviceaccount=kube-system:gitlab-admin
#
# # Get token
# kubectl get secret $(kubectl get secret -n kube-system | grep gitlab-admin | awk '{print $1}') \
#   -n kube-system -o jsonpath="{['data']['token']}" | base64 --decode
#
# # Get cluster CA certificate
# kubectl get secret $(kubectl get secret -n kube-system | grep gitlab-admin | awk '{print $1}') \
#   -n kube-system -o jsonpath="{['data']['ca\.crt']}" | base64 --decode
#
#
# Step 2: Get K8s API URL
# ────────────────────────────────────────────────
# kubectl cluster-info | grep 'Kubernetes master'
# Should be: https://192.168.0.113:6443
#
#
# Step 3: Add Cluster to GitLab
# ────────────────────────────────────────────────
# 1. Go to GitLab: Project → Infrastructure → Kubernetes clusters
# 2. Click "Connect a cluster"
# 3. Enter:
#    - Kubernetes cluster name: project-nebula-k3s
#    - API URL: https://192.168.0.113:6443
#    - CA Certificate: (paste from Step 1)
#    - Token: (paste from Step 1)
#    - Project namespace: production
#
#
# Step 4: Verify Connection
# ────────────────────────────────────────────────
# Once connected:
# - Go to Deploy → Environments
# - Should see "production" environment
# - Click it to see pod status, logs, metrics
# - Deployment history will appear automatically
#
#
# Expected Result in GitLab UI:
# ────────────────────────────────────────────────
# Deploy → Environments
# ├── production (environment)
#     ├── Pod: fastapi-app-xxxxx (status: Running)
#     ├── Pod: fastapi-app-yyyyy (status: Running)
#     ├── Pod: fastapi-app-zzzzz (status: Running)
#     └── [View Logs] [View Metrics]
#
#
# What You Can Do After Integration:
# ────────────────────────────────────────────────
# ✅ See pod status in real-time
# ✅ View pod logs (kubectl logs equivalent)
# ✅ Check pod resource usage
# ✅ Track deployment history
# ✅ See when each deployment occurred
# ✅ One-click view of running version
# ✅ Team members see deployment status without SSH
#
# ============================================================================
