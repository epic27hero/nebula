deploy:
  stage: deploy
  script:
    - echo "✅ Image pushed to registry"
    - echo "🔄 Checking deployment status..."
    - |
      # Run kubectl commands on k3s server via SSH
      ssh deploy-server bash << 'EOF'
        echo "🔍 Checking Gateway status..."
        
        # Check if Gateway exists
        if kubectl get gateway prod-gateway -n production &>/dev/null; then
          GATEWAY_IP=$(kubectl get gateway prod-gateway -n production \
            -o jsonpath='{.status.addresses[0].value}' 2>/dev/null || echo "pending")
          
          echo ""
          echo "======================================="
          echo "✅ Deployment Complete"
          echo "======================================="
          
          if [ -n "$GATEWAY_IP" ] && [ "$GATEWAY_IP" != "pending" ]; then
            echo "🌐 FastAPI Application:"
            echo "   URL: http://${GATEWAY_IP}"
            echo "   Swagger UI: http://${GATEWAY_IP}/docs"
            echo "   Health: http://${GATEWAY_IP}/health"
          else
            echo "⏳ Gateway IP is pending assignment..."
            echo "   Check: kubectl get gateway prod-gateway -n production"
          fi
          
          echo ""
          echo "📊 Application Pods:"
          kubectl get pods -n production -l app=fastapi-app 2>/dev/null || \
            echo "   No pods found (ArgoCD may be syncing...)"
          
          echo "======================================="
        else
          echo "ℹ️  Gateway 'prod-gateway' not found"
          echo "✅ Application deployed - Gateway will be created by Terraform"
        fi
      EOF
  only:
    - master

