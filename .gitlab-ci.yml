stages: [build, push, deploy]

variables:
  REGISTRY: 192.168.0.113:5000
  IMAGE_NAME: fastapi-demo

build:
  stage: build
  script:
    - docker build --no-cache -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    # - docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${REGISTRY}/${IMAGE_NAME}:latest
    - docker tag fastapi-demo:latest 192.168.0.113:5000/fastapi-demo:latest

push:
  stage: push
  script:
    - docker push ${REGISTRY}/${IMAGE_NAME}:latest
    # - docker push 192.168.0.113:5000/fastapi-demo:latest

deploy:
  stage: deploy
  script:
    # - argocd app sync fastapi-prod --insecure
    - echo "Waiting for Gateway to be ready..."
    - |
      GATEWAY_IP=$(kubectl get gateway prod-gateway -n production \
        -o jsonpath='{.status.addresses[0].value}')
      echo "======================================="
      echo "FastAPI is available at:"
      echo "http://${GATEWAY_IP}"
      echo "Swagger UI: http://${GATEWAY_IP}/docs"
      echo "======================================="
  only:
    - master



