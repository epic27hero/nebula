# -----> NEW BEFORE_SCRIPT (GitOps Version)
# Setup Git credentials for committing manifest updates
# Also load service endpoints from config file
before_script: |
  # Load service endpoint configuration
  if [ -f "config/service-endpoints.conf" ]; then
    echo "📋 Loading service endpoints from config..."
    source config/service-endpoints.conf
  else
    echo "⚠️ WARNING: config/service-endpoints.conf not found!"
    echo "   Create it with: ./scripts/update-service-ips.sh --no-prompt"
  fi
  
  # Configure Git for automated commits
  git config --global user.email "gitlab-ci@project-nebula.local"
  git config --global user.name "GitLab CI/CD"
  
  # Setup SSH key for Git operations (if using SSH)
  mkdir -p ~/.ssh
  chmod 700 ~/.ssh
  echo "$SSH_PRIVATE_KEY_GITLAB_TESTING_CI" > ~/.ssh/gitlab_testing_ci_project
  chmod 600 ~/.ssh/gitlab_testing_ci_project
  
  # Configure SSH for git push
  grep -q "Host gitlab" ~/.ssh/config || cat <<EOF >> ~/.ssh/config
  Host gitlab
    HostName ${GITLAB_HOST}
    User git
    IdentityFile ~/.ssh/gitlab_testing_ci_project
    IdentitiesOnly yes
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
  EOF
  chmod 600 ~/.ssh/config

# ============================================================================
# BUILD STAGE: Create Docker image
# ============================================================================
build:
  stage: build
  # -----> NEW: Add environment tracking
  environment:
    name: build
    action: prepare
  
  script: |
    echo "🚧 BUILD PHASE"
    echo "🔨 Building Docker image: ${IMAGE_NAME}"
    docker build --no-cache -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    echo "✅ Build successful: ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    
    # -----> NEW: Tag for GitLab Container Registry
    echo "📦 Tagging for GitLab Container Registry..."
    docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest
    docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    
    # -----> LEGACY: Also tag for old registry (can remove later)
    # docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${REGISTRY}/${IMAGE_NAME}:latest
    # docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    
    echo "✅ Image tagged for GitLab Container Registry"
    echo "   - ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest"
    echo "   - ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

# ============================================================================
# PUSH STAGE: Upload to GitLab Container Registry
# ============================================================================

push:
  stage: push
  script: |
    echo "📤 PUSH PHASE - Uploading to GitLab Container Registry"
    
    echo "🔑 Logging in to GitLab Container Registry..."
    echo "${CI_REGISTRY_PASSWORD}" | docker login -u ${CI_REGISTRY_USER} --password-stdin ${CI_REGISTRY}
    
    echo "📤 Pushing image to GitLab registry: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest"
    
    # ⭐ NEW: Push with retry logic (3 attempts)
    for i in {1..3}; do
      echo "Attempt $i/3..."
      if docker push ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest && \
         docker push ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}; then
        echo "✅ Push successful!"
        break
      else
        if [ $i -eq 3 ]; then
          echo "❌ Push failed after 3 attempts"
          exit 1
        fi
        echo "⚠️ Push failed, retrying in 5 seconds..."
        sleep 5
      fi
    done
    
    # ⭐ NEW: Verify images exist in registry
    echo ""
    echo "🔍 Verifying pushed images..."
    
    if docker pull ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}; then
      echo "✅ Image verified in registry"
    else
      echo "❌ Image verification failed - may be corrupted"
      exit 1
    fi
    
  # ⭐ NEW: Job-level retry configuration
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
