stages:
  - build
  - push
  - update-helm
  - deploy
  - release

# ============================================================
# GLOBAL VARIABLES
# ============================================================
variables:
  IMAGE_NAME: fastapi-demo
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  HELM_VALUES_FILE: helm/fastapi-app/values.yaml
  GIT_STRATEGY: clone
  GIT_DEPTH: 0

# ============================================================
# PIPELINE RULES — ANY BRANCH, NO CI LOOPS
# ============================================================
workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_COMMIT_AUTHOR == "GitLab CI/CD"
      when: never
    - if: $CI_COMMIT_BRANCH
      when: always

# ============================================================
# BEFORE SCRIPT — GIT + SSH
# ============================================================
before_script:
  - echo "🔧 Configuring Git identity"
  - git config --global user.email "gitlab-ci@project-nebula.local"
  - git config --global user.name "GitLab CI/CD"

  - echo "🔐 Setting up SSH"
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - echo "$SSH_PRIVATE_KEY_GITLAB_TESTING_CI" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa

  - |
    cat <<EOF > ~/.ssh/config
    Host gitlab
      HostName ${GITLAB_HOST}
      User git
      IdentityFile ~/.ssh/id_rsa
      StrictHostKeyChecking no
      UserKnownHostsFile /dev/null
    EOF
  - chmod 600 ~/.ssh/config

# ============================================================
# BUILD
# ============================================================
build:
  stage: build
  script: |
    echo "🚧 BUILD STAGE"
    echo "Branch     : ${CI_COMMIT_BRANCH}"
    echo "Commit SHA : ${CI_COMMIT_SHORT_SHA}"

    docker build --no-cache \
      -t ${IMAGE_NAME}:${IMAGE_TAG} .

    echo "✅ Image built: ${IMAGE_NAME}:${IMAGE_TAG}"

# ============================================================
# PUSH — GITLAB CONTAINER REGISTRY (SOURCE OF TRUTH)
# ============================================================
push:
  stage: push
  script: |
    echo "📤 PUSH STAGE"

    echo "🔑 Login to GitLab Registry"
    echo "${CI_REGISTRY_PASSWORD}" | docker login \
      -u ${CI_REGISTRY_USER} \
      --password-stdin ${CI_REGISTRY}

    FULL_IMAGE="${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG}"

    echo "🏷 Tagging image"
    docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${FULL_IMAGE}

    echo "📤 Pushing image"
    docker push ${FULL_IMAGE}

    echo "🔍 Verifying image exists"
    docker pull ${FULL_IMAGE}

    echo "✅ IMAGE AVAILABLE → ${FULL_IMAGE}"

# ============================================================
# UPDATE HELM — GITOPS CORE (THIS IS THE KEY)
# ============================================================
update-helm:
  stage: update-helm
  image: alpine:latest
  variables:
    GIT_STRATEGY: fetch
  script: |
    set -e

    echo "🧠 UPDATE HELM VALUES (GitOps)"

    apk add --no-cache git

    echo "📌 Using branch: ${CI_COMMIT_BRANCH}"

    git config user.name "gitlab-ci"
    git config user.email "gitlab-ci@project-nebula.local"

    echo "🔐 Configuring PAT-based push URL"
    GIT_PUSH_URL="${GITLAB_PROTOCOL}://oauth2:${PROJECT_NEBULA_ACCESS_TOKEN}@${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}.git"
    git remote set-url origin "${GIT_PUSH_URL}"

    git checkout -B "${CI_COMMIT_BRANCH}"

    echo "📄 BEFORE"
    grep -n "repository:\|tag:" "${HELM_VALUES_FILE}"

    echo "✏️ Updating repository + tag"
    sed -i "s|repository:.*|repository: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}|g" "${HELM_VALUES_FILE}"
    sed -i "s|tag:.*|tag: ${IMAGE_TAG}|g" "${HELM_VALUES_FILE}"

    echo "📄 AFTER"
    grep -n "repository:\|tag:" "${HELM_VALUES_FILE}"

    echo "🔍 Git diff (proof)"
    git diff "${HELM_VALUES_FILE}" || true

    git add "${HELM_VALUES_FILE}"

    if git diff --cached --quiet; then
      echo "ℹ️ No changes detected — skipping commit"
      exit 0
    fi

    git commit -m "ci(gitops): update image to ${IMAGE_TAG} [skip ci]"

    echo "📤 Pushing to ${CI_COMMIT_BRANCH}"
    git push origin "${CI_COMMIT_BRANCH}"

    echo "✅ HELM UPDATED — ARGOCD WILL AUTO-SYNC"

# ============================================================
# DEPLOY — ENVIRONMENT MARKER (NO KUBECTL)
# ============================================================
deploy:
  stage: deploy
  environment:
    name: ${CI_COMMIT_BRANCH}
    action: start
  script: |
    echo "🚀 DEPLOY STAGE (GitOps)"

    echo "Environment : ${CI_COMMIT_BRANCH}"
    echo "Image       : ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG}"

    echo "ℹ️ No kubectl here"
    echo "ℹ️ ArgoCD reconciles from Git"

    echo "✅ DEPLOY REGISTERED"

# ============================================================
# RELEASE — AUDIT + TRACEABILITY
# ============================================================
release:
  stage: release
  script: |
    echo "🏷️ RELEASE STAGE"

    RELEASE_TAG="v${CI_PIPELINE_ID}-${IMAGE_TAG}"

    git tag -a ${RELEASE_TAG} -m "
    Release: ${RELEASE_TAG}

    Image:
      ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG}

    Branch:
      ${CI_COMMIT_BRANCH}

    Pipeline:
      ${CI_PIPELINE_URL}
    "

    git push origin ${RELEASE_TAG}

    echo "✅ RELEASE CREATED → ${RELEASE_TAG}"
