deploy:
  stage: deploy
  script:
    - echo "✅ Deployment triggered"
    - |
      # Check if Gateway CRD exists
      if ! kubectl get crd gateways.gateway.networking.k8s.io &>/dev/null; then
        echo "ℹ️  Gateway API not installed - skipping Gateway check"
        echo "✅ Application deployed via ArgoCD"
        exit 0
      fi
      
      # Check if Gateway exists
      if ! kubectl get gateway prod-gateway -n production &>/dev/null; then
        echo "ℹ️  Gateway 'prod-gateway' not found yet"
        echo "✅ Application deployed - Gateway will be available soon"
        exit 0
      fi
      
      # Get Gateway IP if available
      GATEWAY_IP=$(kubectl get gateway prod-gateway -n production \
        -o jsonpath='{.status.addresses[0].value}' 2>/dev/null || echo "")
      
      if [ -n "$GATEWAY_IP" ] && [ "$GATEWAY_IP" != "pending" ]; then
        echo "======================================="
        echo "✅ FastAPI is available at:"
        echo "   http://${GATEWAY_IP}"
        echo "   Swagger UI: http://${GATEWAY_IP}/docs"
        echo "======================================="
      else
        echo "⏳ Gateway IP is pending assignment"
        echo "   Check: kubectl get gateway prod-gateway -n production"
        echo "✅ Application deployed successfully"
      fi
  only:
    - master

