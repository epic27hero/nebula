stages:
  - build
  - push
  - update-helm
  - deploy
  - release
  - discovery

# ============================================================
# GLOBAL VARIABLES
# ============================================================
variables:
  IMAGE_NAME: fastapi-demo
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  HELM_VALUES_FILE: helm/fastapi-app/values.yaml
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  REMOTE_SERVER_IP: "192.168.0.113"

# ============================================================
# PIPELINE RULES — ANY BRANCH, NO CI LOOPS
# ============================================================
workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_COMMIT_AUTHOR == "GitLab CI/CD"
      when: never
    - if: $CI_COMMIT_BRANCH
      when: always

# ============================================================
# BEFORE SCRIPT — GIT + SSH
# ============================================================
before_script:
  - echo "🔧 Configuring Git identity"
  - git config --global user.email "gitlab-ci@project-nebula.local"
  - git config --global user.name "GitLab CI/CD"

  - echo "🔐 Setting up SSH"
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - echo "$SSH_PRIVATE_KEY_GITLAB_TESTING_CI" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa

  - |
    cat <<EOF > ~/.ssh/config
    Host gitlab
      HostName ${GITLAB_HOST}
      User git
      IdentityFile ~/.ssh/id_rsa
      StrictHostKeyChecking no
      UserKnownHostsFile /dev/null
    EOF
  - chmod 600 ~/.ssh/config

# ============================================================
# BUILD
# ============================================================
build:
  stage: build
  script: |
    echo "🚧 BUILD STAGE"
    echo "Branch     : ${CI_COMMIT_BRANCH}"
    echo "Commit SHA : ${CI_COMMIT_SHORT_SHA}"
    BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

    # docker build --no-cache \
    #   -t ${IMAGE_NAME}:${IMAGE_TAG} .
    docker build \
      --no-cache \
      --build-arg APP_VERSION=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}} \
      --build-arg BUILD_TIME=${BUILD_TIME} \
      --build-arg IMAGE_TAG=${CI_COMMIT_SHORT_SHA} \
      -t ${IMAGE_NAME}:${IMAGE_TAG} .

    echo "✅ Image built: ${IMAGE_NAME}:${IMAGE_TAG}"

# ============================================================
# PUSH — GITLAB CONTAINER REGISTRY (SOURCE OF TRUTH)
# ============================================================
push:
  stage: push
  script: |
    echo "📤 PUSH STAGE"

    echo "🔑 Login to GitLab Registry"
    echo "${CI_REGISTRY_PASSWORD}" | docker login \
      -u ${CI_REGISTRY_USER} \
      --password-stdin ${CI_REGISTRY}

    FULL_IMAGE="${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG}"

    echo "🏷 Tagging image"
    docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${FULL_IMAGE}

    echo "📤 Pushing image"
    docker push ${FULL_IMAGE}

    echo "🔍 Verifying image exists"
    docker pull ${FULL_IMAGE}

    echo "✅ IMAGE AVAILABLE → ${FULL_IMAGE}"

# ============================================================
# UPDATE HELM — GITOPS CORE (THIS IS THE KEY)
# ============================================================
update-helm:
  stage: update-helm
  script: |
      set -e

        # ------------------------------------------------------------
        # SSH directory setup (runner-owned)
        # ------------------------------------------------------------
        mkdir -p "$HOME/.ssh"
        chmod 700 "$HOME/.ssh"

        # ------------------------------------------------------------
        # HARD RESET key file (ownership fix)
        # ------------------------------------------------------------
        rm -f "$HOME/.ssh/id_main_113"

        echo "$SSH_PRIVATE_KEY_MAIN_113" > "$HOME/.ssh/id_main_113"
        chmod 600 "$HOME/.ssh/id_main_113"

        # ------------------------------------------------------------
        # Validate key format
        # ------------------------------------------------------------
        ssh-keygen -lf "$HOME/.ssh/id_main_113"

        # ------------------------------------------------------------
        # SSH config (idempotent)
        # ------------------------------------------------------------
        grep -q "Host main-113" "$HOME/.ssh/config" 2>/dev/null || cat <<'EOF' >> "$HOME/.ssh/config"
        Host main-113
          HostName 192.168.0.113
          User root
          IdentityFile ~/.ssh/id_main_113
          IdentitiesOnly yes
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

        chmod 600 "$HOME/.ssh/config"

  script:
    - echo "🔍 Fetching and storing Infrastructure IPs..."
    - |
      ssh main-113 << 'REMOTECMD'
        # 1. Assign Variables
        ARGO_IP=$(kubectl get svc argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        GRAFANA_IP=$(kubectl get svc grafana -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        PROM_IP=$(kubectl get svc prometheus-server -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        FASTAPI_IP=$(kubectl get svc fastapi-app-lb -n production -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        GATEWAY_IP=$(kubectl get svc envoy-production-prod-gateway-5e00b6bc -n gateway-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

        # 2. Print Variables in a clean format
        echo "=========================================================="
        echo "          INFRASTRUCTURE ENDPOINT REPORT                  "
        echo "=========================================================="
        printf "%-20s : %s\n" "ArgoCD UI" "http://$ARGO_IP"
        printf "%-20s : %s\n" "Grafana Dash" "http://$GRAFANA_IP"
        printf "%-20s : %s\n" "Prometheus" "http://$PROM_IP"
        printf "%-20s : %s\n" "FastAPI Prod" "http://$FASTAPI_IP"
        printf "%-20s : %s\n" "Envoy Gateway" "http://$GATEWAY_IP"
        echo "----------------------------------------------------------"

        # 3. Example of using a variable immediately (Health Check)
        echo "Verifying FastAPI Version at $FASTAPI_IP..."
        VERSION=$(curl -s http://$FASTAPI_IP/ | jq -r '.app.version')
        echo "Current App Version: $VERSION"
        echo "=========================================================="
      REMOTECMD  