stages:
  - build
  - push
  - update-helm
  - deploy
  - release
  - discovery

# ============================================================
# GLOBAL VARIABLES
# ============================================================
variables:
  IMAGE_NAME: fastapi-demo
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  HELM_VALUES_FILE: helm/fastapi-app/values.yaml
  GIT_STRATEGY: clone
  GIT_DEPTH: 0

# ============================================================
# PIPELINE RULES — ANY BRANCH, NO CI LOOPS
# ============================================================
workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_COMMIT_AUTHOR == "GitLab CI/CD"
      when: never
    - if: $CI_COMMIT_BRANCH
      when: always

# ============================================================
# BEFORE SCRIPT — GIT + SSH
# ============================================================
before_script:
  - echo "🔧 Configuring Git identity"
  - git config --global user.email "gitlab-ci@project-nebula.local"
  - git config --global user.name "GitLab CI/CD"

  - echo "🔐 Setting up SSH"
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - echo "$SSH_PRIVATE_KEY_GITLAB_TESTING_CI" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa

  - |
    cat <<EOF > ~/.ssh/config
    Host gitlab
      HostName ${GITLAB_HOST}
      User git
      IdentityFile ~/.ssh/id_rsa
      StrictHostKeyChecking no
      UserKnownHostsFile /dev/null
    EOF
  - chmod 600 ~/.ssh/config

# ============================================================
# BUILD
# ============================================================
build:
  stage: build
  script: |
    echo "🚧 BUILD STAGE"
    echo "Branch     : ${CI_COMMIT_BRANCH}"
    echo "Commit SHA : ${CI_COMMIT_SHORT_SHA}"
    BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

    # docker build --no-cache \
    #   -t ${IMAGE_NAME}:${IMAGE_TAG} .
    docker build \
      --no-cache \
      --build-arg APP_VERSION=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}} \
      --build-arg BUILD_TIME=${BUILD_TIME} \
      --build-arg IMAGE_TAG=${CI_COMMIT_SHORT_SHA} \
      -t ${IMAGE_NAME}:${IMAGE_TAG} .

    echo "✅ Image built: ${IMAGE_NAME}:${IMAGE_TAG}"

# ============================================================
# PUSH — GITLAB CONTAINER REGISTRY (SOURCE OF TRUTH)
# ============================================================
push:
  stage: push
  script: |
    echo "📤 PUSH STAGE"

    echo "🔑 Login to GitLab Registry"
    echo "${CI_REGISTRY_PASSWORD}" | docker login \
      -u ${CI_REGISTRY_USER} \
      --password-stdin ${CI_REGISTRY}

    FULL_IMAGE="${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG}"

    echo "🏷 Tagging image"
    docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${FULL_IMAGE}

    echo "📤 Pushing image"
    docker push ${FULL_IMAGE}

    echo "🔍 Verifying image exists"
    docker pull ${FULL_IMAGE}

    echo "✅ IMAGE AVAILABLE → ${FULL_IMAGE}"

# ============================================================
# UPDATE HELM — GITOPS CORE (THIS IS THE KEY)
# ============================================================
update-helm:
  stage: update-helm
  script: |
    set -e

    echo "🧠 UPDATE HELM VALUES (GitOps)"

    echo "📌 Using branch: ${CI_COMMIT_BRANCH}"

    git config user.name "gitlab-ci"
    git config user.email "gitlab-ci@project-nebula.local"

    echo "🔐 Configuring PAT-based push URL"
    GIT_PUSH_URL="http://oauth2:${PROJECT_NEBULA_ACCESS_TOKEN}@${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}.git"
    git remote set-url origin "${GIT_PUSH_URL}"

    echo "🔁 Attaching to branch (exit detached HEAD)"
    git checkout -B "${CI_COMMIT_BRANCH}"

    echo "📄 BEFORE"
    grep -n "repository:\|tag:" "${HELM_VALUES_FILE}"

    echo "✏️ Updating repository + tag"
    sed -i "s|repository:.*|repository: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}|g" "${HELM_VALUES_FILE}"
    sed -i "s|tag:.*|tag: ${IMAGE_TAG}|g" "${HELM_VALUES_FILE}"

    echo "📄 AFTER"
    grep -n "repository:\|tag:" "${HELM_VALUES_FILE}"

    echo "🔍 Git diff (proof)"
    git diff "${HELM_VALUES_FILE}" || true

    git add "${HELM_VALUES_FILE}"

    if git diff --cached --quiet; then
      echo "ℹ️ No changes detected — skipping commit"
      exit 0
    fi

    git commit -m "ci(gitops): update image to ${IMAGE_TAG} [skip ci]"

    echo "📤 Pushing to ${CI_COMMIT_BRANCH}"
    git push origin "${CI_COMMIT_BRANCH}"

    echo "✅ HELM UPDATED — ARGOCD WILL AUTO-SYNC"


# ============================================================
# DEPLOY — ENVIRONMENT MARKER (NO KUBECTL)
# ============================================================
deploy:
  stage: deploy
  environment:
    name: ${CI_COMMIT_BRANCH}
    action: start
  script: |
    echo "🚀 DEPLOY STAGE (GitOps)"

    echo "Environment : ${CI_COMMIT_BRANCH}"
    echo "Image       : ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG}"

    echo "ℹ️ No kubectl here"
    echo "ℹ️ ArgoCD reconciles from Git"

    echo "✅ DEPLOY REGISTERED"

# ============================================================
# RELEASE — AUDIT + TRACEABILITY
# ============================================================
release:
  stage: release
  script: |
    set -e

    echo "🏷️ RELEASE STAGE (Nebula Tag)"

    NEBULA_TAG="nebula-v${CI_PIPELINE_ID}-${IMAGE_TAG}"

    echo "📌 Creating tag: ${NEBULA_TAG}"

    git tag -a "${NEBULA_TAG}" -m "
    Nebula Release: ${NEBULA_TAG}

    Image:
      ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG}

    Branch:
      ${CI_COMMIT_BRANCH}

    Commit:
      ${CI_COMMIT_SHA}

    Pipeline:
      ${CI_PIPELINE_URL}
    "

    echo "🔐 Using PAT-based push for tag"
    GIT_PUSH_URL="http://oauth2:${PROJECT_NEBULA_ACCESS_TOKEN}@${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}.git"

    git push "${GIT_PUSH_URL}" "${NEBULA_TAG}"

    echo "✅ NEBULA RELEASE CREATED → ${NEBULA_TAG}"

# ============================================================
# DISCOVERY — SERVICE ENDPOINT DISCOVERY WITH ERROR HANDLING
# ============================================================
print-service-ips:
  stage: discovery
  image: bitnami/kubectl:latest
  script: |
    set +e  # Continue on errors to show results
    
    echo "🔍 DISCOVERY STAGE - Infrastructure Endpoints"
    echo "=========================================="
    
    # Verify kubectl is available
    if ! command -v kubectl &> /dev/null; then
      echo "❌ ERROR: kubectl is not available"
      exit 1
    fi
    
    echo "✅ kubectl found: $(kubectl version --client --short 2>/dev/null || echo 'version check failed')"
    echo ""
    
    # Function to safely extract service IP with error handling
    get_service_ip() {
      local SERVICE_NAME=$1
      local NAMESPACE=$2
      local DISPLAY_NAME=$3
      
      # Check if service exists
      if ! kubectl get svc "$SERVICE_NAME" -n "$NAMESPACE" &>/dev/null; then
        echo "⚠️  $DISPLAY_NAME: SERVICE NOT FOUND ($SERVICE_NAME in ns/$NAMESPACE)"
        return 1
      fi
      
      # Extract IP
      local IP=$(kubectl get svc "$SERVICE_NAME" -n "$NAMESPACE" \
        -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
      
      # Handle pending or missing IPs
      if [ -z "$IP" ]; then
        echo "⏳ $DISPLAY_NAME: IP NOT YET ASSIGNED (service pending)"
        return 1
      fi
      
      echo "✅ $DISPLAY_NAME: $IP"
      return 0
    }
    
    echo "--- Service IPs ---"
    echo ""
    
    # Collect all results
    ARGO_RESULT=0
    GRAFANA_RESULT=0
    PROM_RESULT=0
    FASTAPI_RESULT=0
    GATEWAY_RESULT=0
    
    # Attempt to retrieve each service IP
    get_service_ip "argocd-server" "argocd" "ArgoCD" || ARGO_RESULT=$?
    get_service_ip "grafana" "monitoring" "Grafana" || GRAFANA_RESULT=$?
    get_service_ip "prometheus-server" "monitoring" "Prometheus" || PROM_RESULT=$?
    get_service_ip "fastapi-app-lb" "production" "FastAPI (Prod)" || FASTAPI_RESULT=$?
    get_service_ip "envoy-production-prod-gateway-5e00b6bc" "gateway-system" "Gateway" || GATEWAY_RESULT=$?
    
    echo ""
    
    # Summary
    FAILED_COUNT=$((ARGO_RESULT + GRAFANA_RESULT + PROM_RESULT + FASTAPI_RESULT + GATEWAY_RESULT))
    
    if [ $FAILED_COUNT -eq 5 ]; then
      echo "❌ ERROR: No services found. Cluster may not be properly configured."
      exit 1
    elif [ $FAILED_COUNT -gt 0 ]; then
      echo "⚠️  WARNING: $FAILED_COUNT service(s) unavailable or IP not assigned yet"
      echo "💡 Services may still be starting. Check cluster status with:"
      echo "   kubectl get svc -A"
      exit 0  # Don't fail the pipeline if some services are missing
    else
      echo "✅ All services are accessible"
      exit 0
    fi
  allow_failure: true  # This stage won't block pipeline on failure
  tags:
    - k8s-runner