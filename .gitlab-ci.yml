stages: [build, push, deploy]

variables:
  REGISTRY: 192.168.0.113:5000
  IMAGE_NAME: fastapi-demo

build:
  stage: build
  script:
    - docker build -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${REGISTRY}/${IMAGE_NAME}:latest

push:
  stage: push
  script:
    - docker push ${REGISTRY}/${IMAGE_NAME}:latest

deploy:
  stage: deploy
  script:
    - argocd app sync fastapi-prod --insecure
  only:
    - master
    

