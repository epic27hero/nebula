stages: [build, push, deploy, release]

# ============================================================================
# GITLAB CI/CD PIPELINE FOR PROJECT NEBULA - ENHANCED GITOPS VERSION
# ============================================================================
# This pipeline implements pure GitOps with:
# 1. BUILD:   Builds Docker image from Dockerfile
# 2. PUSH:    Pushes image to GitLab Container Registry (registry.gitlab.com)
# 3. DEPLOY:  Updates manifests in Git (ArgoCD syncs automatically)
# 4. RELEASE: Creates versioned releases for tracking
#
# Flow:
# - Any push to master branch triggers this pipeline
# - Docker image is built and pushed to GitLab Registry
# - Manifests updated with new image tag + committed to Git
# - ArgoCD detects Git changes and deploys automatically (NO manual kubectl!)
# - Releases track deployment versions
#
# Benefits:
# ✅ Single source of truth = Git manifests
# ✅ ArgoCD handles all deployments (no conflicts)
# ✅ Full audit trail in Git history
# ✅ Easy rollbacks via Git
# ============================================================================

# -----> VARIABLES - ENHANCED FOR GITLAB REGISTRY
variables:
  # OLD: REGISTRY: 192.168.0.113:5000
  # NEW: Using GitLab Container Registry (via $CI_REGISTRY built-in variable)
  # $CI_REGISTRY is automatically set to your GitLab's registry URL
  # This ensures it works from any runner with proper network access
  IMAGE_NAME: "fastapi-demo"
  
  # ============================================================================
  # DYNAMIC CONFIGURATION - Easily customizable for different environments
  # ============================================================================
  # These variables can be overridden in GitLab UI: Settings → CI/CD → Variables
  # To set custom values: Project → Settings → CI/CD → Variables → Add Variable
  # Format: ARGOCD_IP = 192.168.1.100 (for your environment)
  # ============================================================================
  
  # Deployment Infrastructure
  DEPLOY_SERVER: ${DEPLOY_SERVER:-192.168.0.113}
  DEPLOY_USER: ${DEPLOY_USER:-root}
  
  # GitLab Instance Information
  GITLAB_HOST: ${GITLAB_HOST:-192.168.0.190}
  GITLAB_PORT: ${GITLAB_PORT:-80}
  GITLAB_PROTOCOL: ${GITLAB_PROTOCOL:-http}
  
  # ============================================================================
  # SERVICE ENDPOINTS - LOADED FROM CONFIG FILE
  # ============================================================================
  # These values are loaded from config/service-endpoints.conf
  # DO NOT hardcode values here - update the config file instead!
  #
  # To update IPs:
  #   1. Auto-detect from cluster:
  #      ./scripts/detect-service-ips.sh --raw
  #
  #   2. Manual update (interactive):
  #      ./scripts/update-service-ips.sh
  #
  #   3. Update with defaults (fixed IPs):
  #      ./scripts/update-service-ips.sh --no-prompt
  #
  # Config file location: config/service-endpoints.conf
  # ============================================================================
  SERVICE_CONFIG_FILE: "config/service-endpoints.conf"
  
  # -----> NEW: GitLab Container Registry credentials (using built-in GitLab variables)
  # $CI_REGISTRY_USER and $CI_REGISTRY_PASSWORD are automatically set by GitLab
  
  # -----> NEW: Git commit info for manifest updates
  GIT_STRATEGY: clone
  GIT_DEPTH: 0

workflow:
  rules:
    # Skip if commit message contains [skip ci]
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    
    # Skip if author is CI itself (prevents loops)
    - if: $CI_COMMIT_AUTHOR == "GitLab CI/CD"
      when: never
    
    # Skip for tag pushes (releases don't need rebuilds)
    - if: $CI_COMMIT_TAG
      when: never
    
    # Run pipeline for master branch
    - if: $CI_COMMIT_BRANCH == "master"
      when: always
    
    # Run pipeline for feature branch
    - if: $CI_COMMIT_BRANCH == "feature/gitlab-gitops-enhancements"
      when: always
    
    # Skip all other cases
    - when: never  

