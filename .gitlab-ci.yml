stages: [build, push, deploy]

variables:
  REGISTRY: 192.168.0.113:5000
  IMAGE_NAME: fastapi-demo
  DEPLOY_SERVER: 192.168.0.113  # Your k3s server
  DEPLOY_USER: root

before_script: |
  mkdir -p ~/.ssh
  chmod 700 ~/.ssh

  # Write private key
  echo "$SSH_PRIVATE_KEY_GITLAB_TESTING_CI" > ~/.ssh/gitlab_testing_ci_project
  chmod 600 ~/.ssh/gitlab_testing_ci_project

  # Add SSH config only if host entry does not exist
  grep -q "Host deploy-server" ~/.ssh/config || cat <<EOF >> ~/.ssh/config
  Host deploy-server
    HostName ${DEPLOY_SERVER}
    User ${DEPLOY_USER}
    IdentityFile ~/.ssh/gitlab_testing_ci_project
    IdentitiesOnly yes
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
  EOF

  chmod 600 ~/.ssh/config

build:
  stage: build
  script:
    - docker build --no-cache -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    # - docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${REGISTRY}/${IMAGE_NAME}:latest
    - docker tag fastapi-demo:latest 192.168.0.113:5000/fastapi-demo:latest

push:
  stage: push
  script:
    - docker push ${REGISTRY}/${IMAGE_NAME}:latest
    # - docker push 192.168.0.113:5000/fastapi-demo:latest

