# ============================================================================
# DEPLOY STAGE: Update manifests in Git (ArgoCD handles deployment)
# ============================================================================
deploy:
  stage: deploy
  # -----> NEW: Add environment tracking for production
  environment:
    name: production
    url: ${FASTAPI_URL}
    action: prepare
    kubernetes:
      namespace: production
  
  script: |
    echo "🚀 DEPLOYMENT PHASE (GitOps - Pure ArgoCD)"
    echo "==============================================="
    echo ""
    echo "✅ Image pushed to GitLab Container Registry"
    echo "   Registry: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    echo ""
    
    # -----> NEW: Update Kubernetes manifests with new image
    echo "📝 Updating Kubernetes manifests with new image tag..."
    
    # Update deployment.yaml with new image
    sed -i "s|image:.*fastapi-demo.*|image: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}|g" manifests/deployment.yaml
    
    echo "✅ Updated manifests/deployment.yaml"
    
    # -----> NEW: Commit and push updated manifest to Git
    echo ""
    echo "📤 Committing manifest update to Git..."

    git config user.email "gitlab-ci@project-nebula.local"
    git config user.name "GitLab CI/CD"
    git add manifests/deployment.yaml
    git commit -m "🚀 Deploy: Update FastAPI image to ${CI_COMMIT_SHORT_SHA} [skip ci]

    Image: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    Commit: ${CI_COMMIT_SHA}
    Branch: ${CI_COMMIT_BRANCH}
    Pipeline: ${CI_PIPELINE_URL}"
    
    # Push back to repository
    # Note: Using HEAD:branch syntax because runner is in detached HEAD state
    # Using CI_JOB_TOKEN for authentication (built-in GitLab token)
    # GIT_PUSH_URL="${GITLAB_PROTOCOL}://oauth2:${PROJECT_NEBULA_ACCESS_TOKEN}@${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}.git"
    # git push -o ci.skip "${GIT_PUSH_URL}" HEAD:${CI_COMMIT_BRANCH}
    git push -o ci.skip "http://oauth2:${PROJECT_NEBULA_ACCESS_TOKEN}@192.168.0.190/root/project_nebula.git" HEAD:${CI_COMMIT_BRANCH}




    echo "✅ Manifest committed and pushed to Git"
    echo ""
    
    # -----> NEW: Explain GitOps flow
    echo "🔄 GitOps Flow:"
    echo "   1. ✅ Image built and pushed to GitLab Registry"
    echo "   2. ✅ Manifest updated with new image tag"
    echo "   3. ✅ Changes committed to Git"
    echo "   4. ⏳ ArgoCD will auto-sync within 3 minutes"
    echo "   5. ⏳ K3s cluster will receive new image"
    echo ""
    echo "📊 Monitor at:"
    echo "   • ArgoCD: ${ARGOCD_URL}"
    echo "   • FastAPI: ${FASTAPI_URL} (Docs: ${FASTAPI_DOCS_URL})"
    echo "   • Prometheus: ${PROMETHEUS_URL}"
    echo "   • Grafana: ${GRAFANA_URL} (${GRAFANA_CREDENTIALS})"
    echo "   • Kubernetes API: ${KUBE_API_SERVER}"
    echo "   • GitLab Registry: ${GITLAB_PROTOCOL}://${GITLAB_HOST}:${GITLAB_PORT}/${CI_PROJECT_PATH}/container_registry"
    

  only:
    - master
    - feature/gitlab-gitops-enhancements
  retry:
    max: 2
    when:
      - script_failure

