#     IdentitiesOnly yes
#     StrictHostKeyChecking no
#     UserKnownHostsFile /dev/null
#   EOF
#
#   chmod 600 ~/.ssh/config
# -----> END OF LEGACY SSH SETUP

# -----> NEW BEFORE_SCRIPT (GitOps Version)
# Setup Git credentials for committing manifest updates
before_script: |
  # Configure Git for automated commits
  git config --global user.email "gitlab-ci@project-nebula.local"
  git config --global user.name "GitLab CI/CD"
  
  # Setup SSH key for Git operations (if using SSH)
  mkdir -p ~/.ssh
  chmod 700 ~/.ssh
  echo "$SSH_PRIVATE_KEY_GITLAB_TESTING_CI" > ~/.ssh/gitlab_testing_ci_project
  chmod 600 ~/.ssh/gitlab_testing_ci_project
  
  # Configure SSH for git push
  grep -q "Host gitlab" ~/.ssh/config || cat <<EOF >> ~/.ssh/config
  Host gitlab
    HostName 192.168.0.190
    User git
    IdentityFile ~/.ssh/gitlab_testing_ci_project
    IdentitiesOnly yes
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
  EOF
  chmod 600 ~/.ssh/config

# ============================================================================
# BUILD STAGE: Create Docker image
# ============================================================================
build:
  stage: build
  # -----> NEW: Add environment tracking
  environment:
    name: build
    action: prepare
  
  script: |
    echo "🚧 BUILD PHASE"
    echo "🔨 Building Docker image: ${IMAGE_NAME}"
    docker build --no-cache -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    echo "✅ Build successful: ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    
    # -----> NEW: Tag for GitLab Container Registry
    echo "📦 Tagging for GitLab Container Registry..."
    docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest
    docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    
    # -----> LEGACY: Also tag for old registry (can remove later)
    # docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${REGISTRY}/${IMAGE_NAME}:latest
    # docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    
    echo "✅ Image tagged for GitLab Container Registry"
    echo "   - ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest"
    echo "   - ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

# ============================================================================
# PUSH STAGE: Upload to GitLab Container Registry
# ============================================================================
push:
  stage: push
  # -----> NEW: Add environment tracking
  environment:
    name: staging
    action: prepare
  
  script: |
    echo "📤 PUSH PHASE - Uploading to GitLab Container Registry"
    
    # -----> NEW: Login to GitLab Container Registry
    echo "🔑 Logging in to GitLab Container Registry..."
    # Using $CI_REGISTRY_PASSWORD and $CI_REGISTRY_USER (GitLab built-in)
    echo "${CI_REGISTRY_PASSWORD}" | docker login -u ${CI_REGISTRY_USER} --password-stdin ${CI_REGISTRY}
    
    # -----> NEW: Push to GitLab Container Registry
    echo "📤 Pushing image to GitLab registry: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest"
    docker push ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest
    docker push ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    echo "✅ Image pushed to GitLab Container Registry successfully"
    
    # -----> LEGACY: Also push to old registry (can remove later)
    # echo "📤 Pushing image to legacy registry: ${REGISTRY}/${IMAGE_NAME}:latest"
    # docker push ${REGISTRY}/${IMAGE_NAME}:latest
    # docker push ${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    
    echo ""
    echo "📝 Pushed tags:"
    echo "  - ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:latest"
    echo "  - ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    echo ""
    echo "✅ Image now available in GitLab Container Registry"
    echo "   Access at: http://192.168.0.190/${CI_PROJECT_PATH}/container_registry"

# ============================================================================
# DEPLOY STAGE: Update manifests in Git (ArgoCD handles deployment)
# ============================================================================
deploy:
  stage: deploy
  # -----> NEW: Add environment tracking for production
  environment:
    name: production
    url: http://192.168.0.203
    action: prepare
    kubernetes:
      namespace: production
  
  script: |
    echo "🚀 DEPLOYMENT PHASE (GitOps - Pure ArgoCD)"
    echo "==============================================="
    echo ""
    echo "✅ Image pushed to GitLab Container Registry"
    echo "   Registry: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    echo ""
    
    # -----> NEW: Update Kubernetes manifests with new image
    echo "📝 Updating Kubernetes manifests with new image tag..."
    
    # Update deployment.yaml with new image
    sed -i "s|image:.*fastapi-demo.*|image: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}|g" manifests/deployment.yaml
    
    echo "✅ Updated manifests/deployment.yaml"
    
    # -----> NEW: Commit and push updated manifest to Git
    echo ""
    echo "📤 Committing manifest update to Git..."

    git config user.email "gitlab@factentry.com"
    git config user.name "root"
    git add manifests/deployment.yaml
    git commit -m "🚀 Deploy: Update FastAPI image to ${CI_COMMIT_SHORT_SHA}

    Image: ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    Commit: ${CI_COMMIT_SHA}
    Branch: ${CI_COMMIT_BRANCH}
    Pipeline: ${CI_PIPELINE_URL}"
    
    # Push back to repository
    # Note: Using HEAD:branch syntax because runner is in detached HEAD state
    # Using CI_JOB_TOKEN for authentication (built-in GitLab token)
    # Using HTTP (not HTTPS) because GitLab runs on port 80 locally
    # git push "http://gitlab-ci-token:${CI_JOB_TOKEN}@192.168.0.190/root/project_nebula.git" HEAD:${CI_COMMIT_BRANCH}
    git push "http://oauth2:${PROJECT_NEBULA_ACCESS_TOKEN}@192.168.0.190/root/project_nebula.git" HEAD:${CI_COMMIT_BRANCH}

    echo "✅ Manifest committed and pushed to Git"
    echo ""
    
    # -----> NEW: Explain GitOps flow
    echo "🔄 GitOps Flow:"
    echo "   1. ✅ Image built and pushed to GitLab Registry"
    echo "   2. ✅ Manifest updated with new image tag"
    echo "   3. ✅ Changes committed to Git"
    echo "   4. ⏳ ArgoCD will auto-sync within 3 minutes"
    echo "   5. ⏳ K3s cluster will receive new image"
    echo ""
    echo "📊 Monitor at:"
    echo "   • ArgoCD UI: http://192.168.0.202"
    echo "   • FastAPI: http://192.168.0.203"
    echo "   • GitLab Registry: http://192.168.0.190/root/project_nebula/container_registry"
    
  only:
    - master
    - feature/gitlab-gitops-enhancements
  retry:
    max: 2
    when:
      - script_failure

