apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://192.168.0.190/root/project_nebula.git
    path: helm/fastapi-app
    targetRevision: master   # 🔥 FIXED
    # ✅ REMOVED: helm.values override that was forcing tag: latest
    # This allows the CI/CD pipeline to control the image tag via values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
