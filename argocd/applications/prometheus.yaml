apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: "25.13.0"
    helm:
      values: |
        server:
          replicaCount: 1
          service:
            type: LoadBalancer
          retention: "30d"
          global:
            scrape_interval: 15s
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
        alertmanager:
          enabled: true
        pushgateway:
          enabled: false
        nodeExporter:
          enabled: true
        kubeStateMetrics:
          enabled: true  

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  revisionHistoryLimit: 10